<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expediente">
<meta name="robots" content="noindex,nofollow">
<title>Mi Expediente</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#fffdfb;--card:#ffffff;--ink:#463c35;--muted:#8f8177;--tan:#c39a78;--tan-d:#a9805f;--line:#f0e7db;
--g:#6fa57e;--y:#dfa93a;--r:#cf5f55;--gbg:#eef7f0;--ybg:#fdf5e2;--rbg:#fbe9e7;--shadow:0 1px 3px rgba(90,60,40,.06)}
/* Colores siempre claros: no seguimos el modo oscuro del sistema para evitar fondos oscuros inesperados. */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;color:var(--tan-d);margin:.2em 0 .4em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
main{max-width:1000px;margin:0 auto;padding:16px}
header.top{max-width:1000px;margin:0 auto;padding:18px 16px 0}
.sub{color:var(--muted);font-size:.85rem}
.small{font-size:.83rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{background:var(--tan);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:.95rem;cursor:pointer;min-height:44px}
.btn:hover{background:var(--tan-d)}
.btn.ghost{background:transparent;color:var(--tan-d);border:1px solid var(--tan)}
.btn.ok{background:var(--g)}
.btn.danger{background:var(--r)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--tan-d);cursor:pointer;font:inherit;padding:6px 0;text-decoration:underline}
.ccard{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.ccard.g{border-left-color:var(--g)}.ccard.y{border-left-color:var(--y)}.ccard.r{border-left-color:var(--r)}
.ccard:focus-visible,.btn:focus-visible{outline:2px solid var(--tan-d);outline-offset:2px}
.ctop{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.chip.on{background:var(--tan);color:#fff;border-color:var(--tan)}
.chip.g{background:var(--gbg);color:var(--g);border-color:var(--g)}
.chip.y{background:var(--ybg);color:#a5771a;border-color:var(--y)}
.chip.r{background:var(--rbg);color:var(--r);border-color:var(--r)}
.chip.warn{background:var(--ybg);color:#a5771a;border-color:var(--y)}
.banner{border-radius:12px;padding:10px 14px;margin:0 0 14px;background:var(--ybg);border:1px solid var(--y);font-size:.92rem}
.banner.info{background:var(--gbg);border-color:var(--g)}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-weight:600;font-size:.92rem;margin-bottom:3px}
em.hint{display:block;font-style:normal;color:var(--muted);font-size:.8rem;margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--tan);border-color:var(--tan)}
textarea:disabled,input:disabled{opacity:.75}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tan-d);margin-bottom:2px}
.mini p{margin:0;white-space:pre-wrap}
.empty{color:var(--muted)}
.mk{display:flex;gap:8px;flex-wrap:wrap}
.mk .btn{flex:1 1 150px}
.mrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.mrow .t{color:var(--muted);font-size:.78rem;min-width:44px}
.tl{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step h3{display:flex;gap:8px;align-items:center}
.num{background:var(--tan);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font:600 .85rem system-ui}
.lect{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.lect p{margin:4px 0}
.ai{font-size:.72rem;color:var(--tan-d);border:1px dashed var(--tan);border-radius:6px;padding:1px 6px;display:inline-block}
nav#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav#nav button{flex:1 1 0;max-width:200px;background:none;border:0;border-radius:10px;padding:8px 4px;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer}
nav#nav button.on{background:var(--bg);color:var(--tan-d);font-weight:600}
nav#nav span{display:block;font-size:1.25rem;line-height:1.2}
.modalw{position:fixed;inset:0;background:rgba(40,28,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
pre.pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:40vh;overflow:auto;font:.8rem/1.4 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;font-size:.9rem}
#toast.on{opacity:1;transform:translateX(-50%)}
details summary{cursor:pointer;color:var(--tan-d);font-weight:600}
ul.tight{margin:.3em 0;padding-left:1.2em}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px;font-size:.85rem;color:var(--muted)}
.legend i{margin-right:4px}
.hbox{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;box-shadow:var(--shadow);text-align:left}
.hbox .hi{font-size:1.8rem;display:block;margin-bottom:6px}
.hbox h3{margin:0 0 4px}
.hbox.soon{opacity:.55;cursor:default}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.fchip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.fchip.active{background:var(--tan);color:#fff;border-color:var(--tan)}
.fchip.active.r{background:var(--r);border-color:var(--r)}
.fchip.active.y{background:var(--y);border-color:var(--y)}
.fchip.active.g{background:var(--g);border-color:var(--g)}
</style>
</head>
<body>
<header class="top"><h1>Mi expediente</h1><div class="sub">Espacio privado · los datos viven solo en este dispositivo</div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const parse=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const daysAgo=s=>Math.round((today()-parse(s))/DAY);
const fd=s=>s?parse(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'}):'—';
const hm=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const nl=s=>esc(s).replace(/\n/g,'<br>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3800);}
function compressImage(file,maxW,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        try{resolve(canvas.toDataURL('image/jpeg',quality));}catch(e){reject(e);}
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function errorModal(titulo,msg){modal({title:titulo,body:'<p>'+esc(msg)+'</p>',ok:'Entendido',cancel:false});}
async function copyText(text){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);toast('Copiado ✓');return;}
    throw new Error('sin API de portapapeles');
  }catch(e){
    try{
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copiado ✓');
    }catch(_){toast('No pude copiar automático. Selecciona el texto y cópialo manualmente.');}
  }
}
/* Modo "copiar y pegar": en vez de llamar a una API de pago, muestra el texto listo
   para pegar en el Claude.ai normal de la persona y recoge la respuesta que ella pega de vuelta. */
function flowCopiarPegar(promptText){
  return new Promise(resolve=>{
    const w=document.createElement('div');w.className='modalw';
    w.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+
      '<h3>Paso 1 · copia esto</h3><p class="small">Pégalo como un solo mensaje en tu chat normal de Claude.ai.</p>'+
      '<pre class="pre" id="cp-src">'+esc(promptText)+'</pre>'+
      '<div class="row"><button class="btn" id="cp-copy" type="button">Copiar texto</button></div>'+
      '<h3 style="margin-top:16px">Paso 2 · pega aquí su respuesta</h3>'+
      '<textarea id="cp-resp" rows="10" placeholder="Pega aquí lo que te respondió Claude…"></textarea>'+
      '<div class="mact"><button class="btn ghost" data-cp="0" type="button">Cancelar</button><button class="btn" data-cp="1" type="button">Usar esta respuesta</button></div>'+
      '</div>';
    document.body.appendChild(w);
    w.querySelector('#cp-copy').addEventListener('click',()=>copyText(promptText));
    w.addEventListener('click',e=>{
      const b=e.target.closest('[data-cp]');if(!b)return;
      if(b.dataset.cp==='1'){const v=w.querySelector('#cp-resp').value.trim();w.remove();resolve(v||null);}
      else{w.remove();resolve(null);}
    });
  });
}

/* ============ almacenamiento ============ */
const KEY='mx_expediente_v1', CK='mx_expediente_ck';
let S=null, memWarned=false;
function loadS(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){if(!memWarned){memWarned=true;toast('No pude guardar en este navegador. Exporta un respaldo ya.');}}}
let saveT;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,350);}
const cons=id=>S.consultantes.find(c=>c.id===id);
const ses=id=>S.sesiones.find(s=>s.id===id);
const sesDe=cid=>S.sesiones.filter(s=>s.cid===cid).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.num-b.num);

/* ============ cifrado (WebCrypto) ============ */
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function needCrypto(){if(!(window.crypto&&crypto.subtle)){toast('Este navegador/contexto no permite cifrado. Ábrela desde https o localhost.');return false;}return true;}
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptText(text,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(pass,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(text));return JSON.stringify({enc:1,salt:b64(salt),iv:b64(iv),data:b64(ct)});}
async function decryptText(pack,pass){const p=typeof pack==='string'?JSON.parse(pack):pack;const k=await deriveKey(pass,unb64(p.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},k,unb64(p.data));return dec.decode(pt);}

/* ============ Google Calendar (opcional, solo lectura) ============
   No guarda nada en localStorage salvo el Client ID (no es secreto) y las iniciales↔nombre
   que tú mismo capturas por consultante. El token de acceso vive solo en memoria y se pierde
   al cerrar la pestaña; no se hace ninguna escritura al calendario, solo lectura. */
let gcal={tokenClient:null,tokenClientId:null,token:null,expiresAt:0,events:null,lastCheck:null,connecting:false};
function gcalListo(){return !!(window.google&&google.accounts&&google.accounts.oauth2);}
function gcalEnsureTokenClient(){
  if(!gcalListo()){toast('Google todavía no termina de cargar. Espera un segundo e inténtalo de nuevo.');return null;}
  if(!S.cfg.gcalClientId){toast('Primero pega tu Client ID de Google en Ajustes → Google Calendar.');return null;}
  if(!gcal.tokenClient||gcal.tokenClientId!==S.cfg.gcalClientId){
    gcal.tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:S.cfg.gcalClientId,
      scope:'https://www.googleapis.com/auth/calendar.readonly',
      callback:async(resp)=>{
        gcal.connecting=false;
        if(resp&&resp.error){toast('No se pudo conectar con Google Calendar.');rerender();return;}
        gcal.token=resp.access_token;gcal.expiresAt=Date.now()+((resp.expires_in||3000)*1000-30000);
        await gcalFetchEventos();
      }
    });
    gcal.tokenClientId=S.cfg.gcalClientId;
  }
  return gcal.tokenClient;
}
async function gcalListaCalendarios(){
  const url='https://www.googleapis.com/calendar/v3/users/me/calendarList?'+new URLSearchParams({minAccessRole:'reader',maxResults:'250'});
  const res=await fetch(url,{headers:{Authorization:'Bearer '+gcal.token}});
  if(!res.ok)return[{id:'primary',summary:'Principal'}];
  const data=await res.json();
  const cals=(data.items||[]).map(c=>({id:c.id,summary:c.summary||c.id}));
  return cals.length?cals:[{id:'primary',summary:'Principal'}];
}
async function gcalFetchEventos(){
  if(!gcal.token)return;
  try{
    const timeMin=new Date().toISOString();
    const timeMax=new Date(Date.now()+45*DAY).toISOString();
    const cals=await gcalListaCalendarios();
    const todos=[];
    const porCalendario=[];
    for(const cal of cals){
      try{
        const url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(cal.id)+'/events?'+new URLSearchParams({timeMin,timeMax,singleEvents:'true',orderBy:'startTime',maxResults:'250'});
        const res=await fetch(url,{headers:{Authorization:'Bearer '+gcal.token}});
        if(!res.ok){porCalendario.push({summary:cal.summary,count:null,error:res.status});continue;}
        const data=await res.json();
        let n=0;
        (data.items||[]).forEach(ev=>{const start=ev.start&&(ev.start.dateTime||ev.start.date);if(start){todos.push({summary:ev.summary||'',start});n++;}});
        porCalendario.push({summary:cal.summary,count:n});
      }catch(e){porCalendario.push({summary:cal.summary,count:null,error:'red'});}
    }
    gcal.events=todos;
    gcal.porCalendario=porCalendario;
    gcal.lastCheck=Date.now();
  }catch(e){toast('No pude conectar con Google Calendar ahora mismo.');}
  rerender();
}
const normaliza=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function proximaCitaCalendar(c){
  if(!gcal.events||!c.nombreCalendario)return undefined;
  const nombre=normaliza(c.nombreCalendario);
  if(!nombre)return undefined;
  const m=gcal.events.find(e=>normaliza(e.summary).includes(nombre));
  return m?m.start:null;
}

/* ============ modal ============ */
function modal(o){return new Promise(res=>{
  const w=document.createElement('div');w.className='modalw';
  w.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h3>'+esc(o.title)+'</h3><div>'+(o.body||'')+'</div>'+(o.input?'<input id="mi" type="'+o.input+'" autocomplete="off">':'')+'<div class="mact">'+(o.cancel===false?'':'<button class="btn ghost" data-m="0">'+esc(o.cancel||'Cancelar')+'</button>')+'<button class="btn" data-m="1">'+esc(o.ok||'Aceptar')+'</button></div></div>';
  document.body.appendChild(w);
  const inp=w.querySelector('#mi');if(inp)inp.focus();
  w.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const v=b.dataset.m==='1'?(inp?inp.value:true):null;w.remove();res(v);});
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=inp.value;w.remove();res(v);}});
});}

/* ============ enmascarado y API ============ */
function makeMasker(c){
  const terms=((c&&c.mask)||[]).filter(Boolean);
  const rx=w=>{const e=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return new RegExp('(?<![\\p{L}\\p{N}])'+e+'(?![\\p{L}\\p{N}])','giu');}catch(_){return new RegExp(e,'gi');}};
  return{
    fwd:t=>{let x=String(t==null?'':t);terms.forEach((w,i)=>{x=x.replace(rx(w),'[P'+(i+1)+']');});return x;},
    back:t=>{let x=String(t==null?'':t);terms.forEach((w,i)=>{x=x.split('[P'+(i+1)+']').join(w);});return x;}
  };
}
const deep=(o,f)=>Array.isArray(o)?o.map(x=>deep(x,f)):(o&&typeof o==='object')?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,deep(v,f)])):(typeof o==='string'?f(o):o);
let keyMem=null;
async function getKey(){
  if(keyMem)return keyMem;
  const pack=localStorage.getItem(CK);
  if(!pack){toast('Primero guarda tu llave de API en Ajustes.');return null;}
  if(!needCrypto())return null;
  const pass=await modal({title:'Contraseña de tu llave',body:'<p class="small">Solo abre tu llave de API en este dispositivo. Se pide una vez por sesión.</p>',input:'password',ok:'Abrir'});
  if(!pass)return null;
  try{keyMem=await decryptText(pack,pass);return keyMem;}catch(e){toast('Contraseña incorrecta.');return null;}
}
async function callClaude(system,user,max){
  const key=await getKey();if(!key)return null;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.cfg.model,max_tokens:max||1500,system,messages:[{role:'user',content:user}]})});
  if(!r.ok){
    let m='';try{m=(await r.json()).error.message;}catch(e){}
    if(r.status===401)throw new Error('Llave inválida (401). Ve a Ajustes y revisa: (1) que la copiaste completa desde console.anthropic.com, sin espacios ni saltos de línea; (2) que es una llave de la Consola de Anthropic (console.anthropic.com), no tu contraseña de Claude.ai — son cuentas y facturación distintas; (3) que esa cuenta tiene facturación activada. Si acabas de crearla, bórrala aquí y vuelve a pegarla.');
    if(r.status===429)throw new Error('Se alcanzó un límite de uso (429). Espera un momento e inténtalo de nuevo.');
    throw new Error('API '+r.status+(m?': '+m:''));
  }
  const j=await r.json();return(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
async function sendAI(system,user,max){
  if(S.cfg.modo==='api'){
    if(S.cfg.preview){

/* ============ semáforo ============ */
function estadoC(c){
  const pend=sesDe(c.id).filter(s=>{if(s.estado==='validada')return false;const a=daysAgo(s.fecha);return s.estado==='preparada'?a>=1:a>=0;});
  if(!pend.length)return{lvl:'g',txt:'Al día',age:-1};
  const s=pend.reduce((m,x)=>daysAgo(x.fecha)>daysAgo(m.fecha)?x:m);
  const age=daysAgo(s.fecha);
  const lvl=age>7?'r':age>3?'y':'g';
  const nom={preparada:'sin registrar',realizada:'sin borrador',borrador:'sin validar'}[s.estado];
  return{lvl,age,s,txt:'Sesión '+s.num+' '+nom+' · '+age+' d'};
}
function staleHip(c){
  const ss=sesDe(c.id).filter(s=>s.estado!=='preparada').slice(-4);
  if(ss.length<4)return false;
  const n=h=>(h||'').trim().toLowerCase();
  return n(ss[0].hipActiva)&&ss.every(s=>n(s.hipActiva)===n(ss[0].hipActiva));
}
const proxima=c=>sesDe(c.id).find(s=>s.estado==='preparada'&&daysAgo(s.fecha)<=0);
const ultimaConNotas=c=>sesDe(c.id).filter(s=>s.estado!=='preparada').slice(-1)[0];
function ultimoCampo(c,k){const ss=sesDe(c.id).filter(s=>s.estado!=='preparada').reverse();const s=ss.find(x=>(x[k]||'').trim());return s?{v:s[k],n:s.num}:null;}
function temporalidadTxt(c){
  const ss=sesDe(c.id).filter(s=>s.estado!=='preparada');
  if(ss.length<2)return 'Aún no hay suficientes sesiones para calcular la cadencia.';
  const gaps=[];for(let i=1;i<ss.length;i++)gaps.push(Math.round((parse(ss[i].fecha)-parse(ss[i-1].fecha))/DAY));
  const ult=gaps.slice(-4).filter(g=>g>0);
  if(!ult.length)return 'Cadencia: varias sesiones el mismo día.';
  const avg=Math.round(ult.reduce((a,b)=>a+b,0)/ult.length);
  const label=avg<=8?'semanal':avg<=16?'quincenal':avg<=35?'mensual':'cada '+avg+' días';
  return 'Cadencia actual: '+label+' (~'+avg+' días entre sesiones)';
}
function modalidadResumen(c){
  const ss=sesDe(c.id).filter(s=>s.estado!=='preparada').slice(-5);
  if(!ss.length)return null;
  const etiqueta=m=>m==='online'?'En línea 💻':m==='presencial'?'Presencial 🏠':'sin especificar';
  const cont={online:0,presencial:0,sinespecificar:0};
  ss.forEach(s=>{cont[s.modalidad==='online'?'online':s.modalidad==='presencial'?'presencial':'sinespecificar']++;});
  const ult=ss[ss.length-1];
  return{ultima:etiqueta(ult.modalidad),ultimaFecha:ult.fecha,ultimaNum:ult.num,total:ss.length,online:cont.online,presencial:cont.presencial,sinespecificar:cont.sinespecificar};
}

}

function construirDesdeSemilla(seed){
  const consultantes=seed.consultantesBase.map(r=>({id:uid(),ini:r.ini,horario:r.horario,modalidad:r.modalidad,inicio:r.inicio,motivo:r.motivo,hipInicial:'',hipActiva:'',mask:(seed.mask[r.ini]||[]).slice(),hipHist:[],paraProxima:null,historia:seed.historia[r.ini]?JSON.parse(JSON.stringify(seed.historia[r.ini])):{}}));
  const sesiones=[];
  consultantes.forEach(c=>{
    const rows=seed.sesiones[c.ini]||[];
    rows.forEach(r=>{
      sesiones.push({
        id:uid(),cid:c.id,num:r.num,fecha:r.fecha,estado:'validada',modalidad:'',hipActiva:'',foco:'',intencion:'',marcadores:[],notas:'',insight:'',
        movimientos:r.movimientos,movimientoProceso:r.movimientoProceso,intervenciones:r.intervenciones,cierre:'',yo:'',consultante:'',tarea:r.tarea,proximo:r.proximo,
        borrador:'',borradorIA:'',
        final:'Temas clave: '+r.movimientos+'\n\nResumen: '+r.movimientoProceso+'\n\nIntervenciones: '+r.intervenciones+'\n\nPróxima sesión: '+r.proximo,
        borradorFormato:'narrativo',validadaEn:r.fecha+'T12:00:00.000Z'
      });
    });
  });
  return{v:1,consultantes,sesiones,cfg:{model:'claude-sonnet-5',preview:true,formato:'narrativo',modo:'copiar'},meta:{demo:false,lastExport:null}};
}
function estadoVacio(){
  return{v:1,consultantes:[],sesiones:[],cfg:{model:'claude-sonnet-5',preview:true,formato:'narrativo',modo:'copiar'},meta:{demo:false,lastExport:null}};
}
async function pedirDatosReales(){
  if(!needCrypto())return estadoVacio();
  while(true){
    const p=await modal({title:'Desbloquear tus consultantes',body:'<p>Este archivo trae tus consultantes y sesiones guardados de forma cifrada. Escribe tu contraseña para cargarlos en este navegador.</p><p class="small">Si cancelas, la app arranca vacía y puedes importar un respaldo tuyo después desde Ajustes.</p>',input:'password',ok:'Desbloquear',cancel:'Empezar vacío'});
    if(p===null)return estadoVacio();
    if(!p)continue;
    try{
      const json=await decryptText(SEED_ENC,p);
      const seed=JSON.parse(json);
      return construirDesdeSemilla(seed);
    }catch(e){
      toast('Contraseña incorrecta. Intenta de nuevo.');
    }
  }
}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function exportar(cifrado){
  const obj=JSON.parse(JSON.stringify(S));obj.meta.exportedAt=new Date().toISOString();
  let text=JSON.stringify(obj,null,1),name='expediente-'+iso(today());
  if(cifrado){
    if(!needCrypto())return;
    const p=await modal({title:'Contraseña del archivo',body:'<p class="small">Sin esta contraseña no se puede abrir el archivo y no hay forma de recuperarla.</p>',input:'password',ok:'Cifrar y descargar'});
    if(!p||p.length<8){if(p!==null)toast('Usa al menos 8 caracteres.');return;}
    text=await encryptText(text,p);name+='.cifrado.json';
  }else name+='.json';
  download(name,text);S.meta.lastExport=Date.now();save();rerender();
}
async function importar(file){
  let obj;
  try{
    const j=JSON.parse(await file.text());
    if(j.enc){const p=await modal({title:'Contraseña del archivo',body:'',input:'password',ok:'Abrir'});if(!p)return;obj=JSON.parse(await decryptText(j,p));}else obj=j;
  }catch(e){toast('No pude abrir el archivo (¿contraseña incorrecta?).');return;}
  if(!obj||!Array.isArray(obj.consultantes)||!Array.isArray(obj.sesiones)){toast('El archivo no tiene el formato esperado.');return;}
  const ok=await modal({title:'Reemplazar datos',body:'<p>El archivo trae '+obj.consultantes.length+' consultantes y '+obj.sesiones.length+' sesiones. Reemplazará lo que hay ahora en este dispositivo.</p>',ok:'Reemplazar'});
  if(!ok)return;
  obj.cfg=Object.assign({},S.cfg,obj.cfg||{});obj.meta=obj.meta||{};S=obj;save();go('tablero');toast('Datos importados.');
}
function contexto(c){
  const ss=sesDe(c.id).filter(s=>s.estado!=='preparada').slice(-5);
  return ['Consultante: '+c.ini,'Motivo de consulta: '+(c.motivo||'—'),'Hipótesis inicial: '+(c.hipInicial||'—'),'Hipótesis activa: '+(c.hipActiva||'—')].concat(ss.map(s=>'— Sesión '+s.num+' ('+s.fecha+')\nFoco: '+(s.foco||'')+'\nMovimientos clave: '+(s.movimientos||'')+'\nIntervenciones: '+(s.intervenciones||'')+'\nInsight: '+(s.insight||'')+'\nCierre: '+(s.cierre||'')+'\nLa terapeuta sintió: '+(s.yo||'')+'\nPercepción del consultante: '+(s.consultante||'')+'\nMarcadores: '+(s.marcadores||[]).map(k=>k.tipo+': '+k.texto).join(' | '))).join('\n');
}
function hipSync(c,texto,origen){c.hipActiva=texto;c.hipHist=c.hipHist||[];c.hipHist.push({fecha:iso(today()),texto,origen});}

const A={
  nav(b){ui.view=b.dataset.v==='sesion'?'sesion':b.dataset.v;render();window.scrollTo(0,0);},
  'open-c'(b){ui.cid=b.dataset.id;ui.fichaTab='resumen';go('ficha');},
  fichatab(b){ui.fichaTab=b.dataset.t;rerender();},
  'sec-copiar'(b){copyText(secuencialTSV(cons(b.dataset.id)));},
  'sec-csv'(b){const c=cons(b.dataset.id);download('formato-secuencial-'+c.ini.replace(/\s+/g,'-')+'-'+iso(today())+'.csv',secuencialCSV(c),'text/csv');},
  'ver-foto'(b){modal({title:'Genograma',body:'<img src="'+b.dataset.src+'" style="max-width:100%;border-radius:8px">',ok:'Cerrar',cancel:false});},
  'quitar-foto'(b){const c=cons(ui.cid);if(!c)return;hset(c.historia,b.dataset.path,'');save();rerender();},
  'open-s'(b){ui.sid=b.dataset.id;go('sesion');},
  nuevoc(){go('nuevoC');},
  filtro(b){ui.filtro=b.dataset.f;rerender();},
  async 'guardar-c'(){
    const ini=$('#n-ini').value.trim();if(!ini){toast('Escribe las iniciales.');return;}
    if(S.meta.demo){
      const ok=await modal({title:'Tienes datos de demostración',body:'<p>Vas a agregar un consultante real. Los "Demo A–K" son ficticios y quedarán junto a él hasta que tú decidas borrarlos.</p><p class="small">Puedes borrarlos ahora, o dejarlos y quitarlos después desde Ajustes.</p>',ok:'Borrar los Demo ahora',cancel:'Dejarlos por ahora'});
      if(ok){S.consultantes=[];S.sesiones=[];}
      S.meta.demo=false;
    }
    const c={id:uid(),ini,horario:$('#n-hor').value.trim(),modalidad:$('#n-modalidad').value,inicio:$('#n-ini-f').value||iso(today()),motivo:$('#n-mot').value.trim(),hipInicial:'',hipActiva:'',mask:$('#n-mask').value.split(',').map(x=>x.trim()).filter(Boolean),hipHist:[],paraProxima:null,historia:{}};
    S.consultantes.push(c);save();ui.cid=c.id;go('ficha');toast('Consultante agregado.');
  },
  'nueva-s'(){
    const c=cons(ui.cid),ss=sesDe(c.id),num=ss.reduce((m,x)=>Math.max(m,x.num),0)+1;
    const s={id:uid(),cid:c.id,num,fecha:iso(today()),estado:'preparada',modalidad:(c.modalidad==='mixta'?'':c.modalidad||''),hipActiva:c.hipActiva||'',foco:(c.paraProxima&&c.paraProxima.foco)||'',intencion:'',marcadores:[],notas:'',insight:'',movimientos:'',movimientoProceso:'',intervenciones:'',cierre:'',yo:'',consultante:'',tarea:'',proximo:'',borrador:'',borradorIA:'',final:'',borradorFormato:S.cfg.formato||'narrativo'};
    S.sesiones.push(s);save();ui.sid=s.id;go('sesion');
  },
  realizada(){const s=ses(ui.sid);s.estado='realizada';save();rerender();toast('Sesión marcada como realizada.');},
  mark(b){
    const s=ses(ui.sid),i=$('#mk-txt'),v=i.value.trim();if(!v){toast('Escribe primero una frase.');return;}
    s.marcadores=s.marcadores||[];s.marcadores.push({ts:Date.now(),tipo:b.dataset.t,texto:v});
    if(s.estado==='preparada')s.estado='realizada';
    i.value='';i.focus();$('#mlist').innerHTML=mlist(s);save();
  },
  'del-mark'(b){const s=ses(ui.sid);s.marcadores.splice(+b.dataset.i,1);$('#mlist').innerHTML=mlist(s);save();},
  volcar(){
    const s=ses(ui.sid);const map={pregunta:'intervenciones',respuesta:'movimientos',cierre:'cierre'};let n=0;
    (s.marcadores||[]).forEach(m=>{if(m.volcado)return;const k=map[m.tipo];s[k]=(s[k]?s[k]+'\n':'')+'• '+m.texto;m.volcado=true;n++;});
    save();rerender();toast(n?n+' marcadores pasados a los campos.':'No hay marcadores nuevos.');
  },
  'borrador-local'(){const s=ses(ui.sid);s.borrador=armar(s,s.borradorFormato);if(s.estado==='preparada'||s.estado==='realizada')s.estado='borrador';save();rerender();toast('Borrador armado sin IA. Edítalo y valida.');},
  async 'borrador-ia'(){
    const s=ses(ui.sid),c=cons(s.cid),m=makeMasker(c);
    const plano=armar(s,s.borradorFormato);
    const user=m.fwd('Consultante: '+c.ini+'\nNotas de la terapeuta (organízalas, no agregues nada):\n\n'+plano+'\n\nNotas libres: '+(s.notas||'—'));
    try{
      const out=await sendAI(SYS_BORRADOR(s.borradorFormato),user,2200);if(!out)return;
      s.borradorIA=m.back(out);s.borrador=s.borradorIA;if(s.estado==='preparada'||s.estado==='realizada')s.estado='borrador';save();rerender();toast('Borrador listo. Revísalo antes de validar.');
    }catch(e){errorModal('No pude generar el borrador',e.message);}
  },
  async validar(){
    const s=ses(ui.sid);if(!(s.borrador||'').trim()){toast('Primero arma un borrador (con o sin IA).');return;}
    const ok=await modal({title:'Validar nota',body:'<p>Vas a marcar esta nota como <b>final</b>. Lo que hay en el cuadro de borrador, con tus ediciones, será tu versión oficial. Tus notas originales y el borrador quedan guardados aparte.</p>',ok:'La revisé y es mía'});
    if(!ok)return;
    s.final=s.borrador;s.estado='validada';s.validadaEn=Date.now();
    const c=cons(s.cid);if((s.hipActiva||'').trim()&&s.hipActiva.trim()!==(c.hipActiva||'').trim())hipSync(c,s.hipActiva.trim(),'propia (sesión '+s.num+')');
    save();rerender();toast('Nota validada ✔');
  },
  reabrir(){const s=ses(ui.sid);s.estado='borrador';s.validadaEn=null;save();rerender();},
  async 'c-lect'(){
    const K=ui.clin,c=cons(K.cid),m=makeMasker(c);
    const user=m.fwd(contexto(c)+'\n\nMI HIPÓTESIS (terapeuta): '+K.mia);
    K.busy='lect';rerender();
    try{
      const out=await sendAI(SYS_LECT,user,2200);
      if(out){const j=deep(parseJSON(out),m.back);if(!Array.isArray(j.lecturas))throw new Error('formato inesperado');K.lect=j;K.elegida=null;}
    }catch(e){errorModal('No pude obtener lecturas',e.message);}
    K.busy='';rerender();
  },
  'c-elegir'(b){ui.clin.elegida=+b.dataset.i;rerender();toast('Ahora reescríbela con tus palabras en el paso 3.');},
  async 'c-adoptar'(){
    const K=ui.clin,c=cons(K.cid);
    const ok=await modal({title:'Adoptar hipótesis',body:'<p>Pasará a ser la hipótesis activa de <b>'+esc(c.ini)+'</b>:</p><div class="mini"><p>'+nl(K.mia2)+'</p></div>',ok:'Adoptar'});if(!ok)return;
    hipSync(c,K.mia2.trim(),K.elegida!=null?'lectura sugerida, reescrita por mí':'propia');save();rerender();toast('Hipótesis activa actualizada.');
  },
  async 'c-inter'(){
    const K=ui.clin,c=cons(K.cid),m=makeMasker(c);
    const user=m.fwd(contexto(c)+'\n\nMI HIPÓTESIS DE TRABAJO: '+(K.mia2.trim()||K.mia)+'\n\nLA INTERVENCIÓN QUE YO HARÍA EN LOS PRÓXIMOS 5 MINUTOS: '+K.inter);
    K.busy='inter';rerender();
    try{
      const out=await sendAI(SYS_INTER,user,1800);
      if(out){const j=deep(parseJSON(out),m.back);if(!Array.isArray(j.opciones))throw new Error('formato inesperado');K.opc=j;}
    }catch(e){errorModal('No pude obtener opciones',e.message);}
    K.busy='';rerender();
  },
  'c-prox'(){const K=ui.clin,c=cons(K.cid);c.paraProxima={foco:K.foco.trim(),intervencion:K.inter.trim(),fecha:iso(today())};save();toast('Guardado en la ficha de '+c.ini+'.');},
  async 'save-key'(){
    const k=$('#k-key').value.trim(),p=$('#k-pass').value;
    if(!k||p.length<8){toast('Escribe la llave y una contraseña de mínimo 8 caracteres.');return;}
    if(!needCrypto())return;
    localStorage.setItem(CK,await encryptText(k,p));keyMem=k;rerender();toast('Llave guardada y cifrada en este dispositivo.');
  },
  async 'del-key'(){const ok=await modal({title:'Borrar llave',body:'<p>Se borra solo de este dispositivo.</p>',ok:'Borrar'});if(!ok)return;localStorage.removeItem(CK);keyMem=null;rerender();},
  'exp-enc'(){exportar(true);},
  'exp-json'(){exportar(false);},
  imp(){$('#imp').click();},
  async limpio(){
    const ok=await modal({title:'Empezar en limpio',body:'<p>Se borrarán <b>todos</b> los datos de este dispositivo (consultantes y sesiones). Si tienes datos reales, exporta un respaldo primero.</p>',ok:'Borrar todo'});if(!ok)return;
    S={v:1,consultantes:[],sesiones:[],cfg:S.cfg,meta:{demo:false,lastExport:null}};save();go('inicio');
  },
  async 'cargar-reales'(){
    const ok=await modal({title:'Cargar mis 11 consultantes',body:'<p>Esto <b>reemplaza</b> lo que hay ahora mismo en este dispositivo (incluyendo si aún ves nombres "Demo") por tus 11 consultantes reales, con sus sesiones e historias clínicas guardadas de forma cifrada en este archivo.</p><p class="small">Si ya escribiste algo real que no quieres perder, exporta un respaldo antes de continuar. Te pedirá la contraseña de los datos cifrados.</p>',ok:'Reemplazar por mis consultantes'});
    if(!ok)return;
    S=await pedirDatosReales();save();go('tablero');toast(S.consultantes.length?'Listos tus '+S.consultantes.length+' consultantes.':'Se quedó vacío.');
  },
  'gcal-conectar'(){
    const tc=gcalEnsureTokenClient();if(!tc)return;
    gcal.connecting=true;rerender();
    tc.requestAccessToken({prompt:gcal.token?'':'consent'});
  },
  async 'gcal-verificar'(){
    if(!gcal.token){A['gcal-conectar']();return;}
    if(Date.now()>gcal.expiresAt){A['gcal-conectar']();return;}
    await gcalFetchEventos();
  }
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b);}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){const s=ses(ui.sid);if(!s)return;let v=t.value;if(t.dataset.f==='num')v=Number(v)||0;s[t.dataset.f]=v;if(t.dataset.f==='borrador'&&v.trim()&&(s.estado==='preparada'||s.estado==='realizada'))s.estado='borrador';saveSoon();}
  else if(t.dataset.c){ui.clin[t.dataset.c]=t.value;const K=ui.clin,d=(id,f)=>{const el=document.getElementById(id);if(el)el.disabled=f;};d('b-lect',K.mia.trim().length<15||!!K.busy);d('b-adop',K.mia2.trim().length<20);d('b-inter',K.inter.trim().length<15||(K.mia2.trim().length<20&&K.mia.trim().length<15)||!!K.busy);d('b-prox',K.foco.trim().length<10);}
  else if(t.dataset.cf){const c=cons(ui.cid);if(!c)return;c[t.dataset.cf]=t.dataset.cf==='mask'?t.value.split(',').map(x=>x.trim()).filter(Boolean):t.value;saveSoon();}
  else if(t.dataset.h){const c=cons(ui.cid);if(!c)return;c.historia=c.historia||{};hset(c.historia,t.dataset.h,t.value);saveSoon();}
  else if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.type==='checkbox'?t.checked:t.value;save();if(t.dataset.cfg==='modo')rerender();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp'&&t.files[0]){importar(t.files[0]);t.value='';}
  else if(t.dataset.foto){
    const f=t.files&&t.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){toast('Elige un archivo de imagen.');return;}
    compressImage(f,1400,0.85).then(dataUrl=>{
      const c=cons(ui.cid);if(!c)return;
      c.historia=c.historia||{};hset(c.historia,t.dataset.foto,dataUrl);save();rerender();toast('Foto guardada.');
    }).catch(()=>toast('No pude procesar esa imagen.'));
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mk-txt'){e.preventDefault();toast('Toca el tipo de momento: pregunta, respuesta o cierre.');}});

/* ============ arranque ============ */
async function arrancar(){
  S=loadS();
  if(!S||!Array.isArray(S.consultantes)){S=await pedirDatosReales();save();}
  S.cfg=Object.assign({model:'claude-sonnet-5',preview:true,formato:'narrativo',modo:'copiar'},S.cfg||{});S.meta=S.meta||{};
  S.consultantes.forEach(c=>{c.historia=c.historia||{};if(c.modalidad==null)c.modalidad='';if(c.nombreCalendario==null)c.nombreCalendario='';});
  S.sesiones.forEach(s=>{if(s.movimientoProceso==null)s.movimientoProceso='';if(s.modalidad==null)s.modalidad='';});
  render();
}
arrancar();
